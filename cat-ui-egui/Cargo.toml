[package]
name = "cat-ui-egui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GPU-rendered widgets for a radio console: waterfall, spectrum plot, meters, VFO readout, grids, and a generic settings renderer."

[dependencies]
cat-ui = { path = "../cat-ui" }
cat-framework = { path = "../cat-framework" }
cat-signal = { path = "../cat-signal" }
# The console protocol. This crate now hosts the whole console, not just
# widgets, and a console is a protocol client -- see `console`.
cat-native = { path = "../cat-native" }
# The layout and palette a radio's server publishes.
cat-layout = { path = "../cat-layout" }

# `egui` only, not `eframe`. eframe is the application framework -- window
# creation, the event loop, the wgpu surface -- and per ADR 0011 that
# belongs to each radio's own `gui` binary, not to a shared widget set.
# Depending on it here would drag a windowing stack into every consumer.
egui = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
