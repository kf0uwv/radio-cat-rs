[package]
name = "cat-framework"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Generic, radio-independent CAT command engine: command table, parsing, dispatch, and response building."

[dependencies]
thiserror = { workspace = true }

# For `capabilities::RadioCapabilities::signal`. cat-signal is types and one
# trait with no dependencies beyond async-trait, so this does not drag any
# I/O, driver or runtime into the engine -- see
# docs/adr/0010-capability-model-and-normalized-signal-source.md section 3.
cat-signal = { path = "../cat-signal" }

# Serialization only, so capabilities can cross the native protocol without
# a parallel set of wire structs. Types carrying `&'static` fields are
# Serialize-only by necessity -- the server holds them as `const`, and a
# client receives owned mirrors (see cat-server::native).
serde = { workspace = true }
