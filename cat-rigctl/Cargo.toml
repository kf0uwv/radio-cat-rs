[package]
name = "cat-rigctl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Generic Hamlib rigctld-compatible TCP bridge (for WSJT-X's \"Hamlib NET rigctl\" rig type) plus network-server orchestration, radio-independent behind the RigctlRadio trait."

# Cross-platform since the follow-up recorded in
# `docs/adr/0006-windows-network-transport.md` (originally Linux-only — the
# rigctld accept loop was built directly on `monoio::net`/`monoio::spawn`
# with no Windows counterpart; `cat-server::tcp`/`udp` had the same
# structural gap and were fixed the same way). `src/rigctl.rs` (Linux,
# `monoio`-based) and `src/rigctl_windows.rs` (`std` + genuine OS threads,
# mirroring `cat-server::tcp_windows`) both sit behind the shared,
# I/O-free `src/protocol.rs`, and `lib.rs::run` is `#[cfg]`-selected the
# same way. A consuming app depends on this crate unconditionally now — no
# `cfg(target_os = "linux")` gate needed on the dependency itself, only on
# whatever `monoio` this crate pulls in stays target-gated below.
[dependencies]
# BrokerHandle/ClientId/BrokerCatSession (the CatSession adapter a rigctl
# connection's radio client runs on top of) + the existing raw TCP/UDP
# listeners this crate's `run()` also brings up alongside its own rigctld
# listener.
cat-server = { path = "../cat-server" }

# CommandTable<C>/CommandId — `run()` takes a `&'static CommandTable<C>` to
# build the broker with, generic over whichever radio crate's command table
# a caller supplies.
cat-framework = { path = "../cat-framework" }

# CatSession — the physical session trait `run()`'s `session: S` parameter
# is bounded on, matching `cat-server::build`'s own bound exactly.
cat-transport-core = { path = "../cat-transport-core" }

# Async trait support (compatible with !Send futures for monoio) — both
# `RigctlRadio`'s methods and `CatSession`'s.
async-trait = { workspace = true }

# `futures::future::select_all` — waiting on the first of several listener
# tasks (raw TCP/UDP/rigctl) to end (`lib.rs::run`).
futures = { workspace = true }

# Logging — `run()` announces each listener it binds, matching the
# `ft991a`/`ts570d` `server` crates' existing behavior this crate replaces.
tracing = { workspace = true }

# Async runtime (io_uring-based, Linux-only). A real dependency: the
# rigctld accept loop and `run()`'s task orchestration are built directly
# on `monoio::net::{TcpListener, TcpStream}` and `monoio::spawn`, matching
# `cat-server`'s own precedent for this exact target gate.
[target.'cfg(target_os = "linux")'.dependencies]
monoio = { workspace = true }
