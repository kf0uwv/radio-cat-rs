name: CI

# This repository had no CI workflow at all until 2026-08-27 -- only
# `release-app.yml`, the reusable release workflow consumed by the app
# repos. Every crate here was verified solely by whatever the consuming
# apps happened to check, which is how the Windows defects recorded in
# `planning/release_workflow/findings.md` sections 7a-7d survived: the
# Windows test modules had never been executed anywhere. Adding this
# workflow is part of ADR 0012's Task 10.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          # llvm-tools and the bare-metal target are for cat-ft8's no_std
          # link check (ADR 0024).
          components: rustfmt, clippy, llvm-tools
          targets: thumbv8m.main-none-eabihf

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        # libhamlib-utils supplies `rigctl`, which cat-rigctl's live
        # interop tests drive as a real client. Without it those tests are
        # skipped, so the job asserts its presence rather than passing
        # quietly -- see `have_rigctl` in cat-rigctl/src/protocol.rs.
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libhamlib-utils

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install GUI build dependencies
        # `cat-ui-egui` pulls in egui, which needs X11/wayland headers to
        # COMPILE on Linux even though nothing here opens a window: no CI
        # runner has a GPU and no test in this workspace renders.
        run: sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Tests
        # EXPECT_HAMLIB turns cat-rigctl's live interop tests from
        # "skip if rigctl is missing" into "fail if rigctl is missing".
        # This job installs libhamlib-utils above, so their absence here
        # would mean the runner image changed under us -- not a reason to
        # go green. Deliberately scoped to this job: the Windows job does
        # not install Hamlib and those tests skip there by design.
        env:
          EXPECT_HAMLIB: "1"
        run: cargo test --workspace

      - name: Install librtlsdr (for the optional device layer)
        run: sudo apt-get install -y librtlsdr-dev

      - name: Build the feature-gated RTL-SDR device layer
        # Per ADR 0014 section 5: code behind a default-off feature is code
        # CI does not compile, which is exactly how the Windows defects in
        # planning/release_workflow/findings.md section 7 survived. This
        # cannot run -- no runner has a dongle -- but it must at least
        # build, on every PR.
        run: cargo check -p cat-signal-rtlsdr --features device

      - name: Build cat-signal-audio's device layer (ALSA)
        # ADR 0017 sections 10 and 16: capture and playback are behind the
        # default-off `device` feature, so CI must build it explicitly
        # (cat-signal-audio/Cargo.toml has long said this job does; until
        # 2026-10-06 it did not). Built, not run: no runner has a sound card.
        # Consuming apps ship this feature on.
        run: |
          sudo apt-get install -y libasound2-dev
          cargo check -p cat-signal-audio --features device --all-targets

      - name: Test cat-morse's default-off serde feature
        # Same reason as the step above: default-off code is code CI does
        # not otherwise build (ADR 0021).
        run: cargo test -p cat-morse --features serde

      - name: cat-ft8 no_std core on a microcontroller target
        # ADR 0024: the core is no_std, allocation-free and f32-only. The
        # library builds and lints for thumbv8m; then embedded-check links a
        # #![no_main] program with no allocator that packs, encodes,
        # unpacks and synthesizes, prints its flash size, and fails if any
        # f64 soft-float helper (__aeabi_d*, __*df3) is linked.
        run: |
          cargo build -p cat-ft8 --no-default-features --target thumbv8m.main-none-eabihf
          cargo clippy -p cat-ft8 --no-default-features --target thumbv8m.main-none-eabihf -- -D warnings
          CARGO_TARGET_DIR=target/embedded-check cat-ft8/embedded-check/check.sh

      - name: cat-ft8 feature combinations and docs
        # Default-off code is code CI does not otherwise build (ADR 0024):
        # the profile feature (bench example) and the host build without
        # std. Docs must have no broken links in either configuration.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo clippy -p cat-ft8 --all-targets --all-features -- -D warnings
          cargo test -p cat-ft8 --features profile
          cargo test -p cat-ft8 --no-default-features
          cargo doc -p cat-ft8 --no-deps
          cargo doc -p cat-ft8 --no-deps --no-default-features

  windows-check:
    name: Windows (MSVC)
    runs-on: windows-latest

    # Authoritative Windows verification, per ADR 0012.
    #
    # `x86_64-pc-windows-msvc` is the host target on `windows-latest`, so no
    # `--target` flag is needed or wanted -- passing one would force a
    # non-host build for no benefit. The previous convention across the app
    # repos was `cargo check --target x86_64-pc-windows-gnu` on an Ubuntu
    # runner, which type-checked a target nobody ships; ADR 0012 retired it.
    #
    # `cargo test` here is the point, not a bonus. ADR 0006 section 4
    # recorded that the Windows-only test modules stayed unexecuted; they
    # ran for the first time on 2026-08-27 against real hardware and found
    # three classes of broken test plus one production bug
    # (`cat-transport-udp` timing out early -- findings.md section 7d).
    # This job is what stops that from silently recurring.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-windows-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-msvc-
            ${{ runner.os }}-cargo-

      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets

      - name: Clippy (Windows-only code)
        # The Linux job's clippy never sees a `cfg(windows)` line --
        # worker_windows, tcp_windows, rigctl_windows and the Win32 serial
        # backend are type-checked here and nowhere else.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo test (cat-morse serde feature)
        run: cargo test -p cat-morse --features serde

      - name: cargo test (cat-ft8 profile feature)
        # The workspace test above already ran cat-ft8's golden waveform
        # hashes here: they must match the Linux job bit for bit.
        run: cargo test -p cat-ft8 --features profile

      - name: cargo check (cat-signal-audio device layer, WASAPI)
        run: cargo check -p cat-signal-audio --features device --all-targets
