[package]
name = "cat-transport-tcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TCP CAT transport: TcpCatSession, a length-prefixed CatSession implementation over monoio::net::TcpStream."

[dependencies]
cat-transport-core = { path = "../cat-transport-core" }

# Async trait support (compatible with !Send futures for monoio).
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async runtime (io_uring-based, Linux-only). A real dependency, not just a
# dev-dependency: CatSession is #[async_trait(?Send)] per ADR 0002, and
# TcpCatSession is built directly on monoio::net::TcpStream. Target-gated
# per ADR 0002's Consequences and planning/architect/task_plan.md's ground
# rules, matching cat-transport-core and cat-transport-serial.
[target.'cfg(target_os = "linux")'.dependencies]
monoio = { workspace = true }
