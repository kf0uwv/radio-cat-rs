[workspace]
members = [
    "cat-framework",
    "cat-transport-core",
    "cat-transport-serial",
    "cat-transport-tcp",
    "cat-transport-udp",
    "cat-client",
    "cat-native",
    "cat-server",
    "cat-rigctl",
    "cat-diagnostics",
    "cat-signal",
    "cat-signal-rtlsdr",
    "cat-ui",
    "cat-ui-ratatui",
    "cat-ui-egui",
]
resolver = "2"

[workspace.package]
version = "0.7.2"
edition = "2021"
authors = ["Matt Franklin <radiombf@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/kf0uwv/radio-cat-rs"
repository = "https://github.com/kf0uwv/radio-cat-rs"
description = "Shared, radio-independent CAT protocol library"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime (io_uring-based, Linux-only). Not a dependency of
# cat-framework itself (it has no async code) — recorded here for
# cross-crate version consistency as cat-transport-core and later crates
# land, per planning/architect/findings.md §2.
monoio = { version = "0.2.3" }

# Async trait support (compatible with !Send futures for monoio).
async-trait = "0.1"

# `futures::future::select_all` — waiting on the first of several listener
# tasks to end (`cat-rigctl::run`).
futures = "0.3.30"

# JSON for the native protocol's control channel (ADR 0010 section 6).
# Spectrum frames are NOT JSON -- they are separately framed binary, so a
# 2048-bin frame at 60 fps never goes near a serializer.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal UI. Pinned to what `ts570d` and `ft991a` already ship (0.26.3),
# so migrating an app onto these widgets is not also a ratatui upgrade --
# ADR 0011 rev 4's acceptance bar for that migration is that the operator
# sees no change.
ratatui = { version = "0.26.3", features = ["crossterm"] }

# Immediate-mode GUI. The widget crate depends on `egui` alone; `eframe`
# (window + event loop + wgpu surface) belongs to each app's own binary,
# per ADR 0011's seam.
egui = "0.29"

# Error handling
thiserror = "1.0.61"

# Logging
tracing = "0.1.40"

# Linux-specific
libc = "0.2.153"
nix = "0.27.1"
